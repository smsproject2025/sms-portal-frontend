version: '3.8'

# Full-stack SMS Portal
# Run: docker-compose up --build
# Frontend → http://localhost:4200 (or :80 in prod)
# Backend  → http://localhost:8080
# RabbitMQ UI → http://localhost:15672  (guest/guest)

services:

  # ── Infrastructure ──────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: smsportal-mysql
    environment:
      MYSQL_ROOT_PASSWORD: yourpassword
      MYSQL_DATABASE: smsportal
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smsportal-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: smsportal-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # ── Spring Boot Backend ──────────────────────────────────
  backend:
    build:
      context: ./smsportal-backend
      dockerfile: Dockerfile
    container_name: smsportal-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smsportal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: yourpassword
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      APP_CORS_ORIGINS: http://localhost,http://frontend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

  # ── Angular Frontend ─────────────────────────────────────
  frontend:
    build:
      context: ./smsportal-frontend
      dockerfile: Dockerfile
    container_name: smsportal-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
